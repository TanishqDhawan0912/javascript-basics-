  <body>

    <button id="stopbtn">stop</button>

  <script>
    const head = document.querySelector("#heading");

    // const stopchange = () => {

    // const headingchange = setTimeout(headchange, 2000);
    let intervalid;
    const changing = () => {
      console.log("hello");
      console.log(Date.now());
    };

    const change = () => {
      if (!intervalid) {
        intervalid = setInterval(changing, 1000);
      }
    };

    startbtn.addEventListener("click", change);
    stopbtn.addEventListener("click", () => {
      console.log("stopped");
      clearInterval(intervalid);
      intervalid = null;
    });
  </script>
